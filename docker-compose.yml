# Needs a .env next to this file: copy .env.example and fill it in.
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  backend:
    <<: *hardening
    build:
      context: ./backend
    environment:
      AUTH_USERS: ${AUTH_USERS:?set AUTH_USERS in .env (see .env.example)}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      SEED_DEMO: ${SEED_DEMO:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Only the web tier on the private compose network may set X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=64m # starlette spools uploads over 1 MB here
    expose:
      - "8000" # not published: reachable only through the web tier's /api proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    ports:
      - "3011:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      retries: 5

volumes:
  data:
